services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: blogdemo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lmnop
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogdemo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  app:
    build: blog-backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DB: blogdemo
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lmnop
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  db-data: